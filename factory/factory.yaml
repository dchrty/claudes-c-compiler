# factory.yaml — the only thing you should need to change per project.
# This is the example config: a tiny Rust JSON parser project.

# The CLI agent used for both worker AND judge sessions.
# Each invocation is a fresh process — no carried context.
# Supported: codex | claude-code
agent:
  kind: codex

target: |
  Build a JSON parser library in Rust at /workspace/code.
  It must expose `parse(s: &str) -> Result<Value, ParseError>` and
  pass every test in tests/. Performance and code clarity matter,
  but correctness is the only hard requirement.

# Seed: what gets pushed into upstream.git on first init.
# Either a local path (relative to factory.yaml) or a git URL.
seed_repo: ./examples/json_parser_seed

# Gate: how the system decides pass/fail before a change lands.
# Two types supported:
#   - shell: run a command in the workspace; exit 0 = pass, output = feedback
#   - judge: spawn a fresh isolated agent with criteria_md + diff;
#            it writes verdict.json
gate:
  type: shell
  cmd: "cargo test --release 2>&1 | tail -50"
  # For type: judge, instead use:
  #   type: judge
  #   criteria_md: ./JUDGE.md     # path to your rubric (rendered from template at init)

# Per-iteration retry policy.
# An iteration = one claude invocation + one gate run.
# If the gate fails, feedback is fed into the next iteration's prompt.
max_iterations_per_task: 6

# Fleet config.
agents: 4
duration: 2h
cost_cap_usd: 50

# Toolchain: extra apt packages baked into the agent container.
# The base image always has git, curl, node, claude-code-cli.
toolchain:
  apt: [build-essential, pkg-config, libssl-dev]
  rust: stable
  # python: "3.11"   # uncomment for Python projects
  # node: "20"       # always present, override version here
